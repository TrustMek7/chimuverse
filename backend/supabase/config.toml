project_id = "chimuverse"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback", "http://127.0.0.1:5173/auth/callback"]
enable_signup = true
[storage]
enabled = true
file_size_limit = "25MiB"
[functions.calendar]
verify_jwt = false

[functions.youtube]
verify_jwt = false
