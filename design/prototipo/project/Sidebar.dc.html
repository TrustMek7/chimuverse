<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Componente · Barra lateral</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./chimu.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&amp;family=Figtree:wght@400..800&amp;family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav class="side" aria-label="Principal" style="max-width: none; width: 100%; min-height: 100%; font-family: var(--font-body); color: var(--ink)">
  <a class="brand" href="InicioDesktop.dc.html">
    <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 23C10 11 20 7 26 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 3" style="opacity:.55"></path><circle cx="6" cy="23" r="3.5" style="fill:var(--primary)"></circle><circle cx="26" cy="10" r="3.5" style="fill:var(--accent-ink)"></circle><path d="m17 2.5 1 2.4 2.5.4-1.8 1.7.4 2.5-2.1-1.2-2.2 1.2.4-2.5-1.8-1.7 2.5-.4z" style="fill:var(--gold)"></path></svg>
    Chimuverse
  </a>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
    <sc-if value="{{g.hasLabel}}" hint-placeholder-val="{{ true }}"><p class="t-eyebrow nav-g">{{g.label}}</p></sc-if>
    <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
      <a class="nav-a" aria-current="{{it.cur}}" href="{{it.href}}"><span class="i {{it.icon}}" aria-hidden="true"></span>{{it.label}}<sc-if value="{{it.hasCount}}" hint-placeholder-val="{{ false }}"><span class="count">{{it.count}}</span></sc-if></a>
    </sc-for>
  </sc-for>
  <div style="flex: 1 1 24px"></div>
  <a class="nav-a" aria-current="{{settingsCur}}" href="Ajustes.dc.html" style="min-height: 56px"><span class="av av-jl">JL</span><span class="col" style="line-height: 1.2"><span style="color: var(--ink)">José Luis</span><span class="t-xs subtle">Ajustes</span></span></a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"activo":{"editor":"enum","options":["inicio","quests","calendario","universo","animo","vault","devlog","wrapped","citas","watchlist","deseos","metas","finanzas","ajustes"],"default":"inicio"},"$preview":{"width":272,"height":1080}}'>
const NAV = [
  ['', [['inicio', 'Inicio', 'i-home', 'InicioDesktop.dc.html']]],
  ['Nuestro día', [['quests', 'Daily Quests', 'i-quests', 'QuestsDesktop.dc.html', 1], ['calendario', 'Our Calendar', 'i-calendar', 'Calendario.dc.html']]],
  ['Nosotros', [['universo', 'Nuestro Universo', 'i-orbit', 'Universo.dc.html'], ['animo', 'Mood Tracker', 'i-smile', 'Animo.dc.html']]],
  ['Recuerdos', [['vault', 'Memory Vault', 'i-image', 'Vault.dc.html'], ['devlog', 'DevLog of Us', 'i-book', 'DevLog.dc.html'], ['wrapped', 'Our Wrapped', 'i-sparkle', 'Wrapped.dc.html']]],
  ['Experiencias', [['citas', 'Date Planner', 'i-heart', 'Citas.dc.html']]],
  ['Entretenimiento', [['watchlist', 'Watchlist', 'i-film', 'Watchlist.dc.html'], ['deseos', 'Wishlist & Soundtrack', 'i-music', 'Deseos.dc.html']]],
  ['Creciendo', [['metas', 'Goals & Dreams', 'i-target', 'Metas.dc.html'], ['finanzas', 'Our Finances', 'i-wallet', 'Finanzas.dc.html']]]
];
class Component extends DCLogic {
  renderVals() {
    const a = this.props.activo || 'inicio';
    return {
      settingsCur: a === 'ajustes' ? 'page' : 'false',
      groups: NAV.map(g => ({ label: g[0], hasLabel: !!g[0], items: g[1].map(it => ({ label: it[1], icon: it[2], href: it[3], cur: it[0] === a ? 'page' : 'false', hasCount: !!it[4], count: it[4] })) }))
    };
  }
}
</script>
</body>
</html>
